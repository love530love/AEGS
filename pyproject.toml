[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegs"
version = "0.1.0"
description = "Auditable Evolutionary Governance System control-plane prototype"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aegs = "aegs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
